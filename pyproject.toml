[project]
name = "dotfix"
version = "0.1.0"
description = "A dotfiles manager that actually handles multiple repositories"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "zephlol" }]
keywords = ["dotfiles", "symlink", "config", "linux", "macos", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Installation/Setup",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
dotfix = "dotfix:main"

[project.urls]
Homepage = "https://github.com/iamzephlol/dotfix"
Repository = "https://github.com/iamzephlol/dotfix"
Issues = "https://github.com/iamzephlol/dotfix/issues"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["dotfix"]

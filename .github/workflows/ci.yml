name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        # The suite builds its own temp HOME, so a real config dir is never touched.
        # On Windows the symlink tests skip themselves when the runner has no
        # symlink permission — the rest of the suite still runs there.
        #
        # ci_report.py wraps the run so that failures show up as annotations
        # and in the job summary: a job's raw log is only readable by admins
        # of the repository, but annotations are visible to everyone.
        run: python tests/ci_report.py

      - name: Report environment
        if: always()
        shell: bash
        run: |
          echo "python: $(python -V 2>&1)"
          echo "platform: $(python -c 'import sys; print(sys.platform)')"
          # Show whether this runner can create symlinks, so a skipped test
          # is never mistaken for a passing one.
          python -c "
          import os, tempfile
          d = tempfile.mkdtemp()
          try:
              os.symlink(d, os.path.join(d, 'x'), target_is_directory=True)
              print('symlinks: supported')
          except OSError as e:
              print('symlinks: NOT supported —', e)
          "

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ci-tests.log
          if-no-files-found: ignore

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile dotfix.py
      - name: Ensure the script is executable
        run: |
          test -x dotfix.py || { echo "dotfix.py is not executable"; exit 1; }
      - name: Self-check (help output)
        run: python dotfix.py --help

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dotfix
        run: |
          pip install --user --break-system-packages -r requirements-test.txt 2>/dev-null || true
      - name: Run tests
        env:
          HOME: ${{ runner.temp }}
        run: python -m unittest discover -s tests -v
